name: Node.js Express CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Integration Tests
      run: npm test

  # ---- NEW AUTOMATED DEPLOYMENT TO AWS EC2 JOB ----
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Execute Remote SSH Commands to Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        # 1. Pass the URL safely through an environment variable to protect it from appleboy's parser
        envs: REPO_URL
        script: |
          # 2. Clear any lingering partial data and set up our directory structure fresh
          rm -rf ~/apps/node-express-server
          mkdir -p ~/apps/node-express-server
          cd ~/apps/node-express-server
          
          # 3. Clone using the protected environment variable
          git clone "$REPO_URL" .
          
          # 4. Check if the clone worked perfectly
          if [ ! -f "server.js" ]; then
            echo "CRITICAL ERROR: server.js was not cloned!"
            exit 1
          fi
          
          # 5. Production setup and live server execution
          npm install --production
          pm2 delete "node-express-server" || true
          pm2 start server.js --name "node-express-server"
          pm2 save
      env:
        # Define the variable cleanly here outside of the script block
        REPO_URL: "https://github.com"

        