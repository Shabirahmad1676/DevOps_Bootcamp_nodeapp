name: Node.js Express CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Integration Tests
      run: npm test

  # ---- NEW AUTOMATED DEPLOYMENT TO AWS EC2 JOB ----
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Execute Remote SSH Commands to Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Force load the user shell profile to pull node, npm, and pm2 into the path
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

          # 2. Ensure target structural directory paths exist safely
          mkdir -p ~/apps/node-express-server
          cd ~/apps/node-express-server

          # 3. Handle pristine repository cloning vs pulling updates
          if [ ! -d ".git" ]; then
            git clone "https://github.com{{ github.repository }}.git" .
          else
            git fetch --all
            git reset --hard origin/main
          fi

          # 4. Run application setup safely with paths explicitly loaded
          npm ci --production
          
          # 5. Application state management via pm2
          pm2 delete "node-express-server" || true
          pm2 start server.js --name "node-express-server"
          pm2 save
