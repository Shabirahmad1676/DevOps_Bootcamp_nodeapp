name: Node.js Express CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Integration Tests
      run: npm test

  # ---- NEW AUTOMATED DEPLOYMENT TO AWS EC2 JOB ----
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Execute Remote SSH Commands to Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Wipe any existing partial data and recreate the folder fresh
          rm -rf ~/apps/node-express-server
          mkdir -p ~/apps/node-express-server
          cd ~/apps/node-express-server
          
          # 2. Force clone the repository cleanly into the current directory
          git clone "https://github.com{{ github.repository }}.git" .
          
          # 3. Double-check if server.js actually downloaded successfully
          if [ ! -f "server.js" ]; then
            echo "CRITICAL ERROR: server.js was not cloned!"
            exit 1
          fi
          
          # 4. Clean install production packages
          npm install --production
          
          # 5. Reset application process states seamlessly under PM2
          pm2 delete "node-express-server" || true
          pm2 start server.js --name "node-express-server"
          pm2 save
